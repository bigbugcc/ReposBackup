# Batch-backup multiple GitHub repositories to cloud storage.
#
# Edit the `repos` input below to list the repositories you want to back up.
# For private repositories, supply a Personal Access Token (PAT) with
# `repo` scope as the PAT_TOKEN secret.
#
# Required secrets (configure in Settings → Secrets and variables → Actions):
#
#   PAT_TOKEN           – GitHub PAT with `repo` scope (for private repos)
#
#   For Cloudflare R2:
#     R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
#
#   For Tencent Cloud COS:
#     COS_SECRET_ID, COS_SECRET_KEY, COS_BUCKET_NAME, COS_REGION
#
#   For Alibaba Cloud OSS:
#     OSS_ACCESS_KEY_ID, OSS_ACCESS_KEY_SECRET, OSS_BUCKET_NAME, OSS_ENDPOINT
#
#   For FTP:
#     FTP_HOST, FTP_USERNAME, FTP_PASSWORD
#
#   For WebDAV:
#     WEBDAV_URL, WEBDAV_USERNAME, WEBDAV_PASSWORD

name: Batch Backup Repositories

on:
  # Run daily at 03:00 UTC
  schedule:
    - cron: "0 3 * * *"
  # Allow manual trigger with optional branch override
  workflow_dispatch:
    inputs:
      backup_branch:
        description: 'Branch to backup, or "all" for every branch'
        required: false
        default: "all"

jobs:
  backup:
    name: Batch backup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # ── Example: Cloudflare R2 ─────────────────────────────────────────────
      - name: Batch Backup to Cloudflare R2
        uses: bigbugcc/ReposBackup@main
        with:
          storage_type: r2
          backup_branch: ${{ github.event.inputs.backup_branch || 'all' }}
          github_token: ${{ secrets.PAT_TOKEN }}

          # List repositories to back up (one per line, format: owner/repo).
          repos: |
            owner/repo-one
            owner/repo-two
            another-owner/repo-three

          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_bucket_name: ${{ secrets.R2_BUCKET_NAME }}

      # ── Example: Tencent Cloud COS (uncomment to use) ──────────────────────
      # - name: Batch Backup to Tencent COS
      #   uses: bigbugcc/ReposBackup@main
      #   with:
      #     storage_type: tencent_cos
      #     backup_branch: all
      #     github_token: ${{ secrets.PAT_TOKEN }}
      #     repos: |
      #       owner/repo-one
      #       owner/repo-two
      #     cos_secret_id: ${{ secrets.COS_SECRET_ID }}
      #     cos_secret_key: ${{ secrets.COS_SECRET_KEY }}
      #     cos_bucket_name: ${{ secrets.COS_BUCKET_NAME }}
      #     cos_region: ${{ secrets.COS_REGION }}

      # ── Example: Alibaba Cloud OSS (uncomment to use) ──────────────────────
      # - name: Batch Backup to Alibaba OSS
      #   uses: bigbugcc/ReposBackup@main
      #   with:
      #     storage_type: aliyun_oss
      #     backup_branch: all
      #     github_token: ${{ secrets.PAT_TOKEN }}
      #     repos: |
      #       owner/repo-one
      #       owner/repo-two
      #     oss_access_key_id: ${{ secrets.OSS_ACCESS_KEY_ID }}
      #     oss_access_key_secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      #     oss_bucket_name: ${{ secrets.OSS_BUCKET_NAME }}
      #     oss_endpoint: ${{ secrets.OSS_ENDPOINT }}

      # ── Example: FTP (uncomment to use) ────────────────────────────────────
      # - name: Batch Backup to FTP
      #   uses: bigbugcc/ReposBackup@main
      #   with:
      #     storage_type: ftp
      #     backup_branch: all
      #     github_token: ${{ secrets.PAT_TOKEN }}
      #     repos: |
      #       owner/repo-one
      #       owner/repo-two
      #     ftp_host: ${{ secrets.FTP_HOST }}
      #     ftp_username: ${{ secrets.FTP_USERNAME }}
      #     ftp_password: ${{ secrets.FTP_PASSWORD }}

      # ── Example: WebDAV (uncomment to use) ─────────────────────────────────
      # - name: Batch Backup to WebDAV
      #   uses: bigbugcc/ReposBackup@main
      #   with:
      #     storage_type: webdav
